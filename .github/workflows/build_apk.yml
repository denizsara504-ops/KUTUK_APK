name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Python kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Bagimliliklar
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev build-essential
          pip install buildozer cython==0.29.37

      - name: APK derle
        run: |
          cp main.py src/main.py 2>/dev/null || true
          buildozer android debug 2>&1 | tail -100

      - name: APK kaydet
        uses: actions/upload-artifact@v3
        with:
          name: KutukSorgulama-APK
          path: bin/*.apk
          retention-days: 30
