name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bagimliliklar
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev build-essential
          pip install buildozer==1.5.0 cython==0.29.37

      - name: Hazirla
        run: |
          mkdir -p myapp
          cp main.py myapp/main.py
          cp buildozer.spec myapp/buildozer.spec
          sed -i 's/source.dir = .*/source.dir = ./' myapp/buildozer.spec
          sed -i 's/requirements = .*/requirements = python3,kivy==2.3.0/' myapp/buildozer.spec

      - name: APK derle
        working-directory: myapp
        run: |
          yes | buildozer android debug 2>&1 | tail -200

      - name: APK kaydet
        uses: actions/upload-artifact@v4
        with:
          name: KutukSorgulama-APK
          path: myapp/bin/*.apk
          retention-days: 30
